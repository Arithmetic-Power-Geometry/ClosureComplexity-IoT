name: Reproduce Paper

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Reproduce study
        run: python run_all.py

      - name: Upload reproducibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: closure-complexity-iot-results
          path: results/

      - name: Commit regenerated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Reproduce Closure Complexity IoT results"
            git push
          fi
